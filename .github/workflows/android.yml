name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :shared:desktopTest
      - uses: actions/upload-artifact@v4
        with:
          name: jumpflix-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :shared:desktopTest :desktop:test :desktop:createDistributable
      - run: tar -czf jumpflix-desktop-${{ runner.os }}.tar.gz -C desktop/build/compose/binaries/main/app .
      - uses: actions/upload-artifact@v4
        with:
          name: jumpflix-desktop-${{ matrix.os }}
          path: jumpflix-desktop-${{ runner.os }}.tar.gz
